{% extends 'base.html' %}

{% block title %}{{ title }} | Aider Infotech{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <div class="hrms-card shadow-sm">
      <div class="hrms-card-header">
        <h5 class="hrms-card-title"><i class="bi bi-building me-2 text-primary"></i> {{ title }}</h5>
        <a href="{% url 'department_list' %}" class="btn btn-sm btn-light border">Cancel</a>
      </div>
      <div class="hrms-card-body p-4">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold">Department Name <span class="text-danger">*</span></label>
            {{ form.name }}
            <div class="form-text">Must be unique across the corporate enterprise.</div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold">Description / Scope</label>
            {{ form.description }}
          </div>

          <div class="d-flex justify-content-end gap-2">
            <a href="{% url 'department_list' %}" class="btn btn-light border">Cancel</a>
            <button type="submit" class="btn btn-primary px-4">
              {% if is_edit %}Save Changes{% else %}Create Department{% endif %}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
