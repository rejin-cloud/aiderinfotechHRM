{% if messages %}
<div class="mb-4">
  {% for message in messages %}
  <div class="alert alert-{% if message.tags == 'error' %}danger{% elif message.tags == 'warning' %}warning{% elif message.tags == 'success' %}success{% else %}info{% endif %} alert-dismissible fade show shadow-sm border-0 d-flex align-items-center" role="alert">
    <div class="me-2">
      {% if message.tags == 'success' %}<i class="bi bi-check-circle-fill fs-5 text-success"></i>
      {% elif message.tags == 'error' %}<i class="bi bi-exclamation-triangle-fill fs-5 text-danger"></i>
      {% elif message.tags == 'warning' %}<i class="bi bi-exclamation-circle-fill fs-5 text-warning"></i>
      {% else %}<i class="bi bi-info-circle-fill fs-5 text-info"></i>{% endif %}
    </div>
    <div>{{ message }}</div>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>
  {% endfor %}
</div>
{% endif %}
