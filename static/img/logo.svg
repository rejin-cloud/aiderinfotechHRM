<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Tech Badge -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Cyber Hexagonal Core Overlay -->
  <polygon points="60,22 92,40 92,78 60,96 28,78 28,40" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.3"/>
  <polygon points="60,28 86,43 86,75 60,90 34,75 34,43" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="4 3"/>

  <!-- Glowing Interconnected Circuit Lines & Nodes -->
  <circle cx="60" cy="22" r="3.5" fill="#38bdf8" />
  <circle cx="92" cy="40" r="3.5" fill="#38bdf8" />
  <circle cx="92" cy="78" r="3.5" fill="#38bdf8" />
  <circle cx="60" cy="96" r="3.5" fill="#38bdf8" />
  <circle cx="28" cy="78" r="3.5" fill="#38bdf8" />
  <circle cx="28" cy="40" r="3.5" fill="#38bdf8" />

  <!-- Center "A" Tech Node Monogram -->
  <g fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Leg -->
    <path d="M42 78 L60 38 L78 78"/>
    <!-- Crossbar / Circuit Bridge -->
    <path d="M49 64 L71 64" stroke="#38bdf8" stroke-width="5"/>
  </g>

  <!-- Core Quantum Microchip Dot -->
  <circle cx="60" cy="50" r="4.5" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="60" cy="50" r="2" fill="#ffffff"/>
</svg>
